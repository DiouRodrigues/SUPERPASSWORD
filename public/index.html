<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1320">
    <title>superpassword</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:,">
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Centralizado -->
    <link rel="stylesheet" href="./css/styles.css">
    
    <!-- CSS Específico do Telão (Opcional, para ajustes de grid) -->
    <style>
        .header-bar { 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; /* Três colunas simétricas: Placar 1 | Relógio | Placar 2 */
            align-items: center; 
            justify-items: center;
            gap: 20px; 
            margin-top: 10px;
        }
        .score-card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px 20px; 
            border-radius: 16px; 
            font-size: 2em; 
            font-weight: 800; 
            opacity: 0.35; /* Fica sutil quando inativo */
            transition: all 0.3s ease;
            width: 100%;
            max-width: 140px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .score-card.active-team { 
            opacity: 1; 
            transform: scale(1.08); 
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .team1-text { color: var(--team1-color); }
        .team2-text { color: var(--team2-color); }
        .timer-circle { width: 240px; height: 240px; background: var(--bg-card); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 6em; font-weight: 900; border: 6px solid var(--color-warning); box-shadow: 0 0 20px rgba(241, 196, 15, 0.4); transition: 0.2s; }
        .timer-danger { border-color: var(--color-danger); box-shadow: 0 0 30px rgba(231, 76, 60, 0.8); color: var(--color-danger); }
        .pin-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--color-danger); padding: 10px 20px; border-radius: 10px; font-size: 1.5em; font-weight: bold; z-index: 10; letter-spacing: 2px;}
    </style>
</head>
<body>

    <!-- Áudio pré-carregado -->
    <audio id="tick-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <div class="pin-badge" id="pin-display" style="display: none;">
        PIN: <span id="room-pin">...</span>
    </div>

    <div class="container">
        
        <!-- TELA 1: Inicialização / Permissão de Áudio -->
        <div id="screen-init" class="screen active">
            <h1>MEGA SENHA</h1>
            <p>Para o relógio tocar, clique abaixo para iniciar o painel.</p>
            <button id="btn-init-audio" class="btn btn-primary">
                <i class="fa-solid fa-volume-high"></i> INICIAR TELÃO
            </button>
        </div>

        <!-- TELA 2: Lobby de Espera -->
        <div id="screen-lobby" class="screen">
            <h2>AGUARDANDO JOGADORES</h2>
            <p>Acesse o controle pelo celular e digite o PIN acima.</p>
            <div style="margin: 40px 0;">
                <i class="fa-solid fa-mobile-screen-button" style="font-size: 5em; color: var(--team1-color); opacity: 0.5;"></i>
            </div>
            <h3 id="lobby-status">Sala vazia...</h3>
        </div>

        <!-- TELA 3: Jogo Principal -->
        <!-- TELA 3: Jogo Principal -->
        <div id="screen-game" class="screen">
            <h2 id="turn-label" style="margin-bottom: 20px;">Preparando...</h2>
            
            <div class="header-bar">
                <!-- Adicionado o ID ui-score1 aqui -->
                <div id="ui-score1" class="score-card team1-text">
                    <i class="fa-solid fa-shield-halved"></i> <span id="score1">0</span>
                </div>
                
                <div id="timer" class="timer-circle"></div>
                
                <!-- Adicionado o ID ui-score2 aqui -->
                <div id="ui-score2" class="score-card team2-text">
                    <span id="score2">0</span> <i class="fa-solid fa-shield"></i>
                </div>
            </div>
        </div>

        <!-- TELA 4: Vitória -->
        <div id="screen-victory" class="screen">
            <h2>FIM DE JOGO!</h2>
            <h1 id="winner-text" style="font-size: 3.5em; margin: 20px 0;">EQUIPE X VENCEU!</h1>
            <p>Aguardando o controle reiniciar a partida...</p>
        </div>

    </div>

    <!-- Módulo Principal (Onde a mágica JS vai acontecer) -->
     <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/app-telao.js"></script>
</body>
</html>
