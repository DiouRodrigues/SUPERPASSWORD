<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1320">
    <title>superpassword-cel</title>
    
    <link rel="manifest" href="/manifest.json">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./css/styles.css">

    <style>
        .input-pin { width: 100%; padding: 15px; font-size: 1.5em; text-align: center; border-radius: 12px; border: 2px solid var(--team1-color); background: var(--bg-dark); color: white; margin: 20px 0; text-transform: uppercase; font-weight: bold; outline: none; }
        .input-pin:focus { border-color: var(--color-success); }
        .config-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .config-box input { width: 70px; padding: 10px; border-radius: 8px; border: none; text-align: center; font-weight: bold; font-size: 1.2em; background: var(--bg-dark); color: white;}
    </style>
</head>
<body>

    <div class="container" style="max-width: 450px;">
        
        <!-- TELA 1: Login / Digitar PIN -->
        <div id="screen-login" class="screen active">
            <h2>ENTRAR NA SALA</h2>
            <p>Olhe para o telão e digite o código:</p>
            <input type="number" id="input-pin" class="input-pin" placeholder="0000" maxlength="4">
            <button id="btn-join" class="btn btn-primary">
                <i class="fa-solid fa-plug"></i> CONECTAR
            </button>
        </div>

        <!-- TELA 2: Lobby do Jogador (Configurações da rodada) -->
        <div id="screen-player-lobby" class="screen">
            <h2 id="lobby-team-title">Sua vez: Equipe 1</h2>
            <div class="word-display" style="font-size: 1.5em; opacity: 0.5;">ESCONDIDA</div>
            <div class="config-box">
    <label>Tempo da Rodada (s):</label>
    <input type="number" id="input-time" value="60" min="10" step="5">
</div>
            <div class="config-box">
                <label>Acertos para Vencer:</label>
                <input type="number" id="input-target" value="10" min="1">
            </div>
            
            <button id="btn-start-turn" class="btn btn-primary">
                <i class="fa-solid fa-play"></i> INICIAR CRONÔMETRO
            </button>
        </div>

        <!-- TELA 3: Jogo (Palavra e Botões) -->
        <div id="screen-play" class="screen">
            <h2 id="play-team-title">Jogando: Equipe 1</h2>
            
            <div id="word" class="word-display">AGUARDANDO</div>
            
            <div class="controls-row">
                <button id="btn-pass" class="btn btn-pass">
                    <i class="fa-solid fa-forward-step"></i> PASSAR
                </button>
                <button id="btn-correct" class="btn btn-correct">
                    ACERTOU <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </div>

        <!-- TELA 4: Reiniciar após fim de jogo -->
        <div id="screen-end" class="screen">
            <h2>JOGO ENCERRADO!</h2>
            <div class="word-display" id="end-winner-text" style="font-size: 2em; background: var(--color-warning);">VITÓRIA!</div>
            
            <button id="btn-reset" class="btn" style="background: #9b59b6; box-shadow: 0 6px 0 #8e44ad;">
                <i class="fa-solid fa-rotate-right"></i> NOVA PARTIDA
            </button>
        </div>

    </div>

    <!-- Módulo Principal do Controle -->
      <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./js/app-controle.js"></script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('ServiceWorker registrado com sucesso:', registration.scope);
                })
                .catch(error => {
                    console.log('Falha ao registrar o ServiceWorker:', error);
                });
        });
    }
</script>
</body>
</html>
